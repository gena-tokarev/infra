apiVersion: v1
kind: Service
metadata:
  name: cortex-web
  labels:
    app.kubernetes.io/name: cortex-web
    app.kubernetes.io/part-of: cortex
spec:
  selector:
    app.kubernetes.io/name: cortex-web
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-web
  labels:
    app.kubernetes.io/name: cortex-web
    app.kubernetes.io/part-of: cortex
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: cortex-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cortex-web
        app.kubernetes.io/part-of: cortex
        cortex.dev/source-sha: {{ .Values.sourceSha | trunc 63 | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}@{{ .Values.web.image.digest }}"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: cortex-config}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          ports:
            - {name: http, containerPort: 3000}
          startupProbe:
            httpGet: {path: /auth, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /auth, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /auth, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/apps/web/.next/cache}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: next-cache
          emptyDir: {sizeLimit: 256Mi}

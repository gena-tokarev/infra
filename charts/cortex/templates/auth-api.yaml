apiVersion: v1
kind: Service
metadata:
  name: cortex-auth-api
  labels:
    app.kubernetes.io/name: cortex-auth-api
    app.kubernetes.io/part-of: cortex
spec:
  selector:
    app.kubernetes.io/name: cortex-auth-api
  ports:
    - {name: http, port: 3001, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-auth-api
  labels:
    app.kubernetes.io/name: cortex-auth-api
    app.kubernetes.io/part-of: cortex
spec:
  replicas: {{ .Values.authApi.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: cortex-auth-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cortex-auth-api
        app.kubernetes.io/part-of: cortex
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: auth-api
          image: {{ .Values.authApi.image | quote }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: cortex-config}
            - secretRef: {name: cortex-runtime}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - {name: http, containerPort: 3001}
          startupProbe:
            httpGet: {path: /api/health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.authApi.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}

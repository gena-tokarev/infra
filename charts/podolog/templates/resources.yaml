apiVersion: v1
kind: Service
metadata:
  name: podolog-web
  labels:
    app.kubernetes.io/name: podolog-web
spec:
  selector:
    app.kubernetes.io/name: podolog-web
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podolog-web
  labels:
    app.kubernetes.io/name: podolog-web
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: podolog-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podolog-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: {{ .Values.web.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          ports:
            - {name: http, containerPort: 3000}
          startupProbe:
            httpGet: {path: /pl, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /pl, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /pl, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: next-cache
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podolog
spec:
  parentRefs:
    - name: {{ .Values.routing.gatewayName }}
      namespace: {{ .Values.routing.gatewayNamespace }}
      sectionName: podolog-https
  hostnames: [{{ .Values.routing.hostname | quote }}]
  rules:
    - backendRefs:
        - {name: podolog-web, port: 3000}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podolog-www-redirect
spec:
  parentRefs:
    - name: {{ .Values.routing.gatewayName }}
      namespace: {{ .Values.routing.gatewayNamespace }}
      sectionName: podolog-www-https
  hostnames: [{{ .Values.routing.wwwHostname | quote }}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: {{ .Values.routing.hostname | quote }}
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podolog-http-redirect
spec:
  parentRefs:
    - name: {{ .Values.routing.gatewayName }}
      namespace: {{ .Values.routing.gatewayNamespace }}
      sectionName: http
  hostnames:
    - {{ .Values.routing.hostname | quote }}
    - {{ .Values.routing.wwwHostname | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}

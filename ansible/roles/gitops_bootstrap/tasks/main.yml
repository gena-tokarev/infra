---
- name: Apply the platform root Application
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../../bootstrap/platform-root.yaml') }}"
  register: gitops_bootstrap_platform_root
  changed_when: "'created' in gitops_bootstrap_platform_root.stdout or 'configured' in gitops_bootstrap_platform_root.stdout"

- name: Wait for the platform root to create the CloudNativePG Application
  ansible.builtin.command: kubectl -n argocd get application/cloudnative-pg
  register: gitops_bootstrap_cnpg_application
  retries: 60
  delay: 5
  until: gitops_bootstrap_cnpg_application.rc == 0
  changed_when: false

- name: Read the CloudNativePG Application status
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - argocd
      - get
      - application/cloudnative-pg
      - -o
      - json
  register: gitops_bootstrap_cnpg_status
  changed_when: false

- name: Retry a previously failed CloudNativePG synchronization
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - argocd
      - patch
      - application/cloudnative-pg
      - --type=merge
      - --patch
      - >-
        {"operation":{"initiatedBy":{"username":"ansible-bootstrap"},"sync":{"prune":true,"syncOptions":["CreateNamespace=true","ServerSideApply=true","PruneLast=true"]}}}
  when:
    - (gitops_bootstrap_cnpg_status.stdout | from_json).status.sync.status != 'Synced'
    - >-
      (gitops_bootstrap_cnpg_status.stdout | from_json).status.operationState.phase
      | default('') in ['Error', 'Failed']
  changed_when: true

- name: Wait for CloudNativePG Application to synchronize
  ansible.builtin.command: >-
    kubectl -n argocd wait --for=jsonpath='{.status.sync.status}'=Synced
    application/cloudnative-pg --timeout=10m
  changed_when: false

- name: Wait for CloudNativePG operator
  ansible.builtin.command: kubectl -n cnpg-system rollout status deployment/cnpg-cloudnative-pg --timeout=10m
  changed_when: false

- name: Wait for Image Updater Application to synchronize
  ansible.builtin.command: >-
    kubectl -n argocd wait --for=jsonpath='{.status.sync.status}'=Synced
    application/argocd-image-updater --timeout=10m
  changed_when: false

- name: Wait for Image Updater controller
  ansible.builtin.command: >-
    kubectl -n argocd rollout status deployment/argocd-image-updater-controller --timeout=10m
  changed_when: false

- name: Wait for Image Updater configuration to synchronize
  ansible.builtin.command: >-
    kubectl -n argocd wait --for=jsonpath='{.status.sync.status}'=Synced
    application/image-updater-config --timeout=10m
  changed_when: false

- name: Read remaining platform Application statuses
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - argocd
      - get
      - application/{{ item }}
      - -o
      - json
  loop:
    - gateway-api
    - cert-manager
    - platform-config
    - cortex-data
  register: gitops_bootstrap_platform_statuses
  changed_when: false

- name: Retry previously failed platform synchronizations
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - argocd
      - patch
      - application/{{ item.item }}
      - --type=merge
      - --patch
      - >-
        {{
          {
            'operation': {
              'initiatedBy': {'username': 'ansible-bootstrap'},
              'sync': {
                'prune': true,
                'syncOptions': (
                  (item.stdout | from_json).spec.syncPolicy.syncOptions
                  | default([])
                )
              }
            }
          } | to_json
        }}
  loop: "{{ gitops_bootstrap_platform_statuses.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - (item.stdout | from_json).status.sync.status != 'Synced'
    - >-
      (item.stdout | from_json).status.operationState.phase
      | default('') in ['Error', 'Failed']
  changed_when: true

- name: Wait for remaining platform Applications to synchronize
  ansible.builtin.command: >-
    kubectl -n argocd wait --for=jsonpath='{.status.sync.status}'=Synced
    application/{{ item }} --timeout=10m
  loop:
    - gateway-api
    - cert-manager
    - platform-config
    - cortex-data
  changed_when: false

- name: Wait for CloudNativePG database readiness
  ansible.builtin.command: >-
    kubectl -n cortex wait --for=condition=Ready
    cluster.postgresql.cnpg.io/cortex-postgres --timeout=10m
  changed_when: false

- name: Wait for ephemeral Redis
  ansible.builtin.command: kubectl -n cortex rollout status deployment/cortex-redis --timeout=10m
  changed_when: false

- name: Apply the workload root Application
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../../bootstrap/workloads-root.yaml') }}"
  register: gitops_bootstrap_workloads_root
  changed_when: >-
    'created' in gitops_bootstrap_workloads_root.stdout or
    'configured' in gitops_bootstrap_workloads_root.stdout

- name: Wait for workload Applications to synchronize
  ansible.builtin.command: >-
    kubectl -n argocd wait --for=jsonpath='{.status.sync.status}'=Synced
    application/{{ item }} --timeout=10m
  loop:
    - cortex
    - podolog
  changed_when: false

- name: Wait for application image policy readiness
  ansible.builtin.command: >-
    kubectl -n argocd wait --for=condition=Ready
    imageupdater/application-images --timeout=10m
  changed_when: false

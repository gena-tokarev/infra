---
- name: Check installed Helm version
  ansible.builtin.command: /usr/local/bin/helm version --short
  register: helm_installed
  failed_when: false
  changed_when: false

- name: Install pinned Helm
  when: helm_version not in helm_installed.stdout | default('')
  block:
    - name: Download verified Helm archive
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
        checksum: "sha256:{{ helm_archive_sha256 }}"
        mode: "0644"

    - name: Extract Helm archive
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install Helm binary
      ansible.builtin.copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        remote_src: true
        owner: root
        group: root
        mode: "0755"

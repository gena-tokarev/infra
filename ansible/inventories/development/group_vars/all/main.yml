environment_name: development
infra_repository_url: git@github.com:gena-tokarev/infra.git
infra_repository_revision: main

k3s_version: v1.36.1+k3s1
k3s_installer_url: https://get.k3s.io
k3s_installer_sha256: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b
helm_version: v4.2.3
helm_archive_sha256: e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c
argocd_chart_version: 9.5.22

cortex_postgres_user: cortex
cortex_postgres_database: cortex_auth

managed_path: /etc/cortex-infra

podolog_hostname: podolog-warsaw.pl
podolog_www_hostname: www.podolog-warsaw.pl
cortex_hostname: cortex-dev.podolog-warsaw.pl
letsencrypt_email: gennadii.tokariev@gmail.com

cortex_runtime_public:
  REDIS_URL: redis://redis:6379
  AUTH_ACCESS_TOKEN_TTL_SECONDS: "900"
  AUTH_REFRESH_TOKEN_TTL_SECONDS: "604800"
  AUTH_COOKIE_ACCESS_TOKEN_NAME: cortex_access_token
  AUTH_COOKIE_REFRESH_TOKEN_NAME: cortex_refresh_token
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAME_SITE: lax
  AUTH_EXTERNAL_AUTH_CODE_TTL_SECONDS: "300"
  GOOGLE_CALLBACK_URL: https://cortex-dev.podolog-warsaw.pl/api/external-auth/google/callback
  GOOGLE_ALLOWED_WEB_REDIRECT_URIS: https://cortex-dev.podolog-warsaw.pl
  GOOGLE_ALLOWED_NATIVE_REDIRECT_URIS: cortex://auth/callback
  PASSKEY_RP_ID: cortex-dev.podolog-warsaw.pl
  PASSKEY_RP_NAME: Cortex
  PASSKEY_ALLOWED_ORIGINS: https://cortex-dev.podolog-warsaw.pl
  WEB_APP_ORIGIN: https://cortex-dev.podolog-warsaw.pl
  AUTH_API_URL: http://cortex-auth-api:3001

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cortex-data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: workloads
  source:
    repoURL: git@github.com:gena-tokarev/infra.git
    targetRevision: main
    path: charts/cortex-data
    helm:
      releaseName: cortex-data
  destination:
    server: https://kubernetes.default.svc
    namespace: cortex
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: 20
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
    syncOptions: [CreateNamespace=true, PruneLast=true]

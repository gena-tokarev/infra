apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gateway-system
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes: &allowedRoutes
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: public
    - name: podolog-https
      protocol: HTTPS
      port: 443
      hostname: podolog-warsaw.pl
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: podolog-tls}
      allowedRoutes: *allowedRoutes
    - name: podolog-www-https
      protocol: HTTPS
      port: 443
      hostname: www.podolog-warsaw.pl
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: podolog-tls}
      allowedRoutes: *allowedRoutes
    - name: cortex-https
      protocol: HTTPS
      port: 443
      hostname: cortex-dev.podolog-warsaw.pl
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: cortex-tls}
      allowedRoutes: *allowedRoutes
    - name: argocd-https
      protocol: HTTPS
      port: 443
      hostname: argocd.podolog-warsaw.pl
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: argocd-tls}
      allowedRoutes: *allowedRoutes

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    email: gennadii.tokariev@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: public
                namespace: gateway-system
                group: gateway.networking.k8s.io
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: podolog
  namespace: gateway-system
spec:
  secretName: podolog-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - podolog-warsaw.pl
    - www.podolog-warsaw.pl
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cortex
  namespace: gateway-system
spec:
  secretName: cortex-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - cortex-dev.podolog-warsaw.pl

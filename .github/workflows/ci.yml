name: Validate infra

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.20.0

      - name: Install actionlint
        run: |
          set -eu
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' |
            sha256sum --check
          tar -xzf actionlint.tar.gz actionlint

      - name: Validate workflows
        run: ./actionlint .github/workflows/*.yml

      - name: Validate repository
        run: ./scripts/validate.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build SOPS plugin
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: tools/argocd-sops-plugin
          file: tools/argocd-sops-plugin/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=argocd-sops-plugin
          cache-to: type=gha,mode=max,scope=argocd-sops-plugin

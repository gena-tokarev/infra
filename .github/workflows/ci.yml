name: Validate infra

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Install validation tools
        run: |
          set -eu
          python3 -m venv ansible/.venv
          ansible/.venv/bin/pip install --requirement ansible/requirements.txt
          echo "$GITHUB_WORKSPACE/ansible/.venv/bin" >> "$GITHUB_PATH"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' |
            sha256sum --check
          tar -xzf actionlint.tar.gz actionlint

      - name: Validate workflows and Ansible
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ./actionlint .github/workflows/*.yml
          ansible-lint ansible/playbooks/*.yml
          ansible-playbook -i ansible/inventories/ci/hosts.yml ansible/playbooks/bootstrap.yml --syntax-check

      - name: Validate rendered infrastructure
        run: ./scripts/validate.sh

apiVersion: v1
kind: Secret
metadata:
  name: cortex-runtime
  namespace: cortex
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  POSTGRES_USER: cortex
  POSTGRES_PASSWORD: REPLACE_WITH_EXISTING_POSTGRES_PASSWORD
  POSTGRES_DB: cortex_auth
  DATABASE_URL: postgresql://cortex:REPLACE_WITH_URL_ENCODED_PASSWORD@postgres:5432/cortex_auth?schema=public
  REDIS_URL: redis://redis:6379
  AUTH_ACCESS_TOKEN_SECRET: REPLACE_WITH_EXISTING_ACCESS_TOKEN_SECRET
  AUTH_REFRESH_TOKEN_SECRET: REPLACE_WITH_EXISTING_REFRESH_TOKEN_SECRET
  AUTH_EXTERNAL_AUTH_STATE_SECRET: REPLACE_WITH_EXISTING_EXTERNAL_AUTH_STATE_SECRET
  GOOGLE_CLIENT_ID: REPLACE_WITH_EXISTING_GOOGLE_CLIENT_ID
  GOOGLE_CLIENT_SECRET: REPLACE_WITH_EXISTING_GOOGLE_CLIENT_SECRET
